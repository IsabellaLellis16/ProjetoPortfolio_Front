<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Autenticação</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <section>
        <img src="img/fundo.jpg" alt="fundo" class="">
        <div class="texto-sobreposto">
            <h1>Faça seu Login</h1>
            <form action="">
        <fieldset>
            <div class="usuario">
                <label for="email"><b>Usuário:</b></label>
                <div class="input-item">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="username" id="text" placeholder="Insira seu email ou CPF">
                </div>
            </div>

            <div class="senha">
                <label for=""><b>Senha:</b></label>
                <div class="input-item">
                    <i class="fa-solid fa-lock"></i>
                    <input id="senha" type="password" placeholder="********">
                </div>
            </div>
        </fieldset>

        <button><a href="#">Entrar</a></button>
    </form>
        </div>
    </section>
</body>
</html>
